name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A tag manda, mas gradle.properties e' a fonte da verdade da versao.
      # Se os dois divergirem o release para aqui, antes de publicar um jar
      # com numero de versao errado dentro do fabric.mod.json.
      - name: Check tag matches mod_version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MOD="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "$TAG" != "$MOD" ]; then
            echo "::error::tag v$TAG nao bate com mod_version=$MOD em gradle.properties"
            exit 1
          fi
          echo "versao confirmada: $MOD"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
